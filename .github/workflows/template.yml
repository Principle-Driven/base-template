name: Template

on: [pull_request]

permissions:
  contents: read

jobs:
  checksums:
    # Projects made from the template skip this job, and their first run removes this file.
    if: github.repository == 'Principle-Driven/base-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: shasum -a 256 --check .template/files.sha256
